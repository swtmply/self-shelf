<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Self Shelf Open Graph image</title>
    <style>
      @font-face {
        font-family: "DM Sans";
        src: url("../node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2");
        font-weight: 100 1000;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "DM Sans", Arial, sans-serif; }
      .canvas { position: relative; width: 1200px; height: 630px; overflow: hidden; color: #233a2a; background: #eff6ec; }
      .canvas::before { content: ""; position: absolute; width: 700px; height: 700px; top: -350px; right: -280px; border-radius: 50%; background: #d9ead8; }
      .canvas::after { content: ""; position: absolute; width: 470px; height: 470px; bottom: -350px; left: -190px; border-radius: 50%; background: #e1eee0; }
      .brand { position: absolute; z-index: 2; top: 49px; left: 64px; font-size: 31px; font-weight: 850; letter-spacing: -1.2px; }
      .brand span, h1 span { color: #4d8a5f; }
      .eyebrow { position: absolute; z-index: 2; top: 156px; left: 66px; color: #598166; font-size: 16px; font-weight: 800; letter-spacing: 2px; }
      h1 { position: absolute; z-index: 2; top: 190px; left: 62px; margin: 0; font-size: 73px; font-weight: 830; line-height: 1.02; letter-spacing: -4px; }
      .description { position: absolute; z-index: 2; top: 445px; left: 66px; width: 460px; margin: 0; color: #667d6b; font-size: 24px; line-height: 1.35; }
      .frame { position: absolute; top: 88px; left: 576px; width: 750px; height: 500px; overflow: hidden; border: 1px solid #d8e5d6; border-radius: 24px; background: #fff; box-shadow: 0 30px 60px #244b2d3b, 0 5px 12px #244b2d18; transform: rotate(-3deg); }
      .chrome { display: flex; align-items: center; gap: 8px; height: 40px; padding-left: 18px; border-bottom: 1px solid #e4e9e1; background: #fafcf9; }
      .chrome i { width: 10px; height: 10px; border-radius: 50%; background: #bfd3bf; }
      .chrome small { margin-left: 15px; color: #849889; font-size: 13px; font-weight: 750; }
      .frame img { display: block; width: 1000px; height: auto; margin-left: -12px; }
    </style>
  </head>
  <body>
    <main class="canvas">
      <div class="brand">Self <span>Shelf</span></div>
      <div class="eyebrow">YOUR PERSONAL LINK LIBRARY</div>
      <h1>Keep good<br />links <span>close.</span></h1>
      <p class="description">Save articles, tools, and ideas worth revisiting.</p>
      <div class="frame">
        <div class="chrome"><i></i><i></i><i></i><small>Self Shelf</small></div>
        <img src="screenshots/library.png" alt="Self Shelf bookmark collection" />
      </div>
    </main>
  </body>
</html>
